name: ai_voice_docs
description: "Voxi Translate — real-time speech-to-text, translation and text-to-speech."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Networking (used by translation datasource + reserved for cloud provider stubs)
  dio: ^5.7.0

  # Immutable models / codegen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local persistence
  shared_preferences: ^2.3.3

  # Speech, translation & TTS
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  translator: ^1.0.3+1

  # Permissions & platform
  permission_handler: ^11.3.1
  share_plus: ^10.1.2

  # UI
  flag: ^7.0.0
  intl: ^0.20.2
  pdf: ^3.13.0
  path_provider: ^2.1.6
  archive: ^4.0.9
  collection: ^1.19.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
